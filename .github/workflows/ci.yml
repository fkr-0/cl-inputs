name: CI
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SBCL 2.6.2 and CLPM 0.4.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl bzip2 ca-certificates tmux
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o sbcl.tar.bz2 \
            https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.2/sbcl-2.6.2-x86-64-linux-binary.tar.bz2
          echo "1758d003f60fa166db014999a73cf9af02726ca7803ab9057dec32a92e2b6322  sbcl.tar.bz2" | sha256sum -c -
          tar -xjf sbcl.tar.bz2
          (cd sbcl-2.6.2-x86-64-linux && sudo sh install.sh)
          curl -fLsS --retry 3 -o clpm.tar.gz \
            https://files.clpm.dev/clpm/clpm-0.4.1-linux-amd64.tar.gz
          echo "da39d9ecd1732d7062ea4c2a39ee8f43fa2213259431abd09b611c679db9e6a5f031267a9e5cd45cee2ac87f078cc7ae579dd53fe98657978c7dd37f97e87e90  clpm.tar.gz" | sha512sum -c -
          tar -xzf clpm.tar.gz
          (cd clpm-0.4.1-linux-amd64 && sudo sh install.sh)
          sbcl --version
          clpm version
      - name: Configure SBCL for CI (ASDF + log4cl package unlocks)
        run: |
          cat > "$HOME/.sbclrc" <<'SBCLRC'
          (require :asdf)
          (dolist (p '(:sb-c :sb-pcl :sb-int :sb-kernel))
            (let ((pkg (find-package p)))
              (when pkg (sb-ext:unlock-package pkg))))
          SBCLRC
      - name: Install pinned dependencies
        run: CLPM_HOME=.cache/clpm clpm bundle install
      - name: Compile standalone core
        run: |
          CLPM_HOME=.cache/clpm clpm bundle exec --with-client sbcl -- --noinform --non-interactive \
            --eval '(asdf:load-system "cl-inputs" :force t)'
      - name: Python threshold-gate tests
        run: python3 -m unittest discover -s tests -p test_coverage_gate.py -v
      - name: Kernel PTY input and termios restoration
        run: python3 tests/pty-e2e.py
      - name: Private tmux terminal-app black-box tests
        run: python3 tests/tmux-terminal-apps.py --timeout 20
      - name: FiveAM with SB-COVER instrumentation
        run: |
          CLPM_HOME=.cache/clpm clpm bundle exec --with-client sbcl -- \
            --noinform --non-interactive --load coverage.lisp
      - name: Enforce measured line coverage >= 52% (target 85%)
        run: python3 tests/coverage_gate.py coverage/coverage.info --min 52
      - name: Upload HTML LCOV and source-denominator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl-inputs-coverage
          path: |
            coverage/cover*.html
            coverage/coverage.info
            coverage/coverage.json
            coverage/coverage-badge.json
          if-no-files-found: warn

  publish-coverage:
    name: Publish verified coverage to gh-pages
    needs: test-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cl-inputs-coverage
          path: coverage
      - name: Publish verified coverage to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./coverage
          force_orphan: false
